<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>MY PROFILE</h1>
            <p>Web Programming Practice</p>
        </header>

        <!-- Profile -->
        <section class="profile">
            <img src="profile.jpg" alt="프로필 사진">

            <div class="profile-info">
                <h2>냠수렝 빌궁</h2>

                <p>전공: 컴퓨터소프트웨어전공</p>
                <p>관심분야: Web / AI / XR</p>
            </div>
        </section>

        <!-- Skills -->
        <section class="box">
            <h2>관심 기술</h2>

            <div class="skills">
                <span class="html">HTML</span>
                <span class="css">CSS</span>
                <span class="javascript">JavaScript</span>
                <span class="git">Git</span>
            </div>
        </section>

        <!-- Introduction -->
        <section class="box">
            <h2>자기소개</h2>

            <p>
                안녕하세요.
            </p>

            <p>
                제 이름은 빌궁입니다. 제가 대구대학교 유학생입니다.
            </p>

            <p>
                앞으로 JavaScript와 React까지 학습하여
                사용자와 상호작용할 수 있는 다양한 웹 서비스를
                개발하는 것이 목표입니다.
            </p>
        </section>

        <!-- Contact -->
        <section class="box">
            <h2>문의하기</h2>

            <form>
                <div class="input-row">
                    <label>이름</label>
                    <input type="text" placeholder="이름을 입력하세요">
                </div>

                <div class="input-row">
                    <label>이메일</label>
                    <input type="email" placeholder="이메일을 입력하세요">
                </div>

                <button type="submit">문의하기</button>
            </form>
        </section>

        <!-- Footer -->
        <footer>
            2026 Web Programming Practice
        </footer>

    </div>

</body>
</html>
